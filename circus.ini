# The Circus control socket has NO authentication: anyone who can reach `endpoint`
# can run arbitrary commands as this circusd user. Keep it on 127.0.0.1 (or use
# ipc:///path/to/socket with restrictive permissions). Never bind to 0.0.0.0.
[circus]
endpoint = tcp://127.0.0.1:5555
pubsub_endpoint = tcp://127.0.0.1:5556
stats_endpoint = tcp://127.0.0.1:5557

[watcher:dummy]
cmd = python -c "import time; [time.sleep(1) for _ in iter(int, 1)]"
numprocesses = 1
